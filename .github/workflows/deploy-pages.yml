name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "platform_frontend/**"
      - "reflections-app/frontend/src/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform_frontend/package-lock.json

      - name: Build platform dashboard
        working-directory: platform_frontend
        run: |
          npm ci
          npm run build
          rm -rf ../frontend/platform
          mkdir -p ../frontend/platform
          cp -R dist/. ../frontend/platform/

      - name: Upload frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
