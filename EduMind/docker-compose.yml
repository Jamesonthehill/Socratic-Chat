services:
  frontend:
    build: 
      context: ./client
      dockerfile: Dockerfile
    container_name: edumind_client
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    volumes:
      - ./client:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      - backend
    env_file:
      - .env

  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    container_name: edumind_server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    volumes:
      - ./server:/app
      - /app/node_modules
      - file_storage:/app/files
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: npm run start
    env_file:
      - .env
    depends_on:
      - mysql
      - ml-service

  mysql:
    image: mysql:8.3
    container_name: edumind_database
    restart: "on-failure: 10"
    ports:
      - "3306:3306"
    volumes:
      - edumind_database:/var/lib/mysql
      - ./init_scripts:/docker-entrypoint-initdb.d
    env_file:
      - .env

  ml-service:
    container_name: ml-service
    build: ./ml-service
    ports:
      - "9621:9621"
    volumes:
      - file_storage:/app/data/${PROJECT_ID}/rag_storage
      - file_storage:/app/data/${PROJECT_ID}/inputs
      - ./config.ini:/app/config.ini
      - ./.env:/app/.env
    env_file:
      - .env
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PROJECT_ID=${PROJECT_ID}
      - WORKING_DIR=/app/data/${PROJECT_ID}/rag_storage
      - INPUT_DIR=/app/data/${PROJECT_ID}/inputs

volumes:
  edumind_database:
  file_storage:
