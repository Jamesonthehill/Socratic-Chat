der</text><path d="M1000,210 L1793,310" fill="none" stroke="#2D607F" stroke-width="4" marker-end="url(#a)"/><text x="1000" y="1060" text-anchor="middle" fill="#18344C" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Each assignment selects one tool. No automatic student handoff occurs between tools.</text><text x="1000" y="1100" text-anchor="middle" fill="#526675" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400">Rectangles show logical roles; they are not separate deployed services or separate models.</text></svg>