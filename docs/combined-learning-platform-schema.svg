<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1630" viewBox="0 0 2200 1630" role="img" aria-labelledby="title desc">
<title id="title">Combined learning platform architecture schema</title>
<desc id="desc">Canvas and the shared frontend connect to the platform FastAPI gateway. Socratic Chat, Debate, and AIducate run in the platform process. SDL and Reflections are private FastAPI services called with a service token. Each tool has a distinct state owner, with shared RAG, PostgreSQL schema boundaries, and configured AI provider APIs below.</desc>
