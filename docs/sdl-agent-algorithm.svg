<text x="114" y="658" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">SDL CONTROLLER</text>
<text x="102" y="700" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Confirm prerequisites</text>
<text x="102" y="724" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Show starting point, outcomes, and readings.</text>
<text x="102" y="747" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Learner confirms familiarity before study.</text>
<rect x="965" y="625" width="760" height="134" rx="17" fill="#eaf2f7" stroke="#587184" stroke-width="2"/>
<rect x="987" y="637" width="186" height="30" rx="15" fill="#cfdfeb"/>
<text x="1004" y="658" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">SDL CONTROLLER</text>
<text x="992" y="700" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Ask familiarity</text>
<text x="992" y="724" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Self-report adjusts support and emphasis;</text>
<text x="992" y="747" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">it does not assign an ability level.</text>
