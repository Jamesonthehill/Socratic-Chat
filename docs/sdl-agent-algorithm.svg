<text x="900.0" y="64" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="middle" fill="#1b3348">Self-Directed Learning — Algorithm</text>
<text x="900.0" y="106" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" text-anchor="middle" fill="#1b3348">Published V2 lesson • bounded and standard paths</text>
<text x="900.0" y="170" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" fill="#587184">The SDL service owns the lesson state machine; the platform supplies identity and access.</text>
