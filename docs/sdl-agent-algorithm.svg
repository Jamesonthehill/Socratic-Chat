<text x="447" y="430" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Start or resume an attempt</text>
<text x="447" y="454" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1b3348">Load the frozen lesson plan and saved student stage.</text>
