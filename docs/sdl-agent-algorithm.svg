<text x="447" y="275" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Prepare and publish a reviewed lesson</text>
<text x="447" y="299" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start" fill="#1b3348">Validate a reviewed plan from selected materials, questions, keys, and rubrics.</text>
