<rect x="97" y="807" width="175" height="30" rx="15" fill="#cfdfeb"/>
<text x="114" y="828" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">STUDY SUPPORT</text>
<text x="102" y="870" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Study approved resources</text>
<text x="102" y="894" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Answer clarification requests from lesson assets</text>
<text x="102" y="917" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">and selected course excerpts.</text>
<rect x="965" y="795" width="760" height="134" rx="17" fill="#eaf2f7" stroke="#587184" stroke-width="2"/>
<rect x="987" y="807" width="175" height="30" rx="15" fill="#cfdfeb"/>
<text x="1004" y="828" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">STUDY SUPPORT</text>
<text x="992" y="870" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Study at learner’s pace</text>
<text x="992" y="894" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Offer approved readings, explanations, and</text>
<text x="992" y="917" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">examples until the learner starts the quiz.</text>
<path d="M455 929 V957" fill="none" stroke="#587184" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1345 929 V957" fill="none" stroke="#587184" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="75" y="965" width="760" height="134" rx="17" fill="#eaf2f7" stroke="#587184" stroke-width="2"/>
<rect x="97" y="977" width="197" height="30" rx="15" fill="#cfdfeb"/>
<text x="114" y="998" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">QUIZ CONTROLLER</text>
<text x="102" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Run five authored questions</text>
<text x="102" y="1064" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Use fixed answer keys, up to three attempts,</text>
<text x="102" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">hints/readings, and first-attempt score.</text>
<rect x="965" y="965" width="760" height="134" rx="17" fill="#eaf2f7" stroke="#587184" stroke-width="2"/>
<rect x="987" y="977" width="252" height="30" rx="15" fill="#cfdfeb"/>
<text x="1004" y="998" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">DIAGNOSTIC EVALUATOR</text>
<text x="992" y="1040" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Run five authored questions</text>
<text x="992" y="1064" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Check choices, confidence, and later reasoning;</text>
<text x="992" y="1087" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">select concept needs and learning paths.</text>
<path d="M455 1099 V1127" fill="none" stroke="#587184" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1345 1099 V1127" fill="none" stroke="#587184" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="75" y="1135" width="760" height="134" rx="17" fill="#eaf2f7" stroke="#587184" stroke-width="2"/>
<rect x="97" y="1147" width="219" height="30" rx="15" fill="#cfdfeb"/>
<text x="114" y="1168" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">TARGETED PRACTICE</text>
<text x="102" y="1210" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Offer optional review</text>
<text x="102" y="1234" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">For missed first attempts, offer a worked</text>
<text x="102" y="1257" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">example and a fresh practice question.</text>
<rect x="965" y="1135" width="760" height="134" rx="17" fill="#eaf2f7" stroke="#587184" stroke-width="2"/>
<rect x="987" y="1147" width="241" height="30" rx="15" fill="#cfdfeb"/>
<text x="1004" y="1168" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">ADAPTIVE CONTROLLER</text>
<text x="992" y="1210" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Let learner choose a format</text>
<text x="992" y="1234" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Simpler explanation, worked example, fresh</text>
<text x="992" y="1257" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">practice, challenge, or recap.</text>
<path d="M455 1269 V1297" fill="none" stroke="#587184" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1345 1269 V1297" fill="none" stroke="#587184" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="75" y="1305" width="760" height="134" rx="17" fill="#eaf2f7" stroke="#587184" stroke-width="2"/>
<rect x="97" y="1317" width="263" height="30" rx="15" fill="#cfdfeb"/>
<text x="114" y="1338" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">APPLICATION EVALUATOR</text>
<text x="102" y="1380" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Assess the final task</text>
<text x="102" y="1404" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Use the published rubric and course material;</text>
<text x="102" y="1427" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">return strengths, errors, and improvements.</text>
<rect x="965" y="1305" width="760" height="134" rx="17" fill="#eaf2f7" stroke="#587184" stroke-width="2"/>
<rect x="987" y="1317" width="230" height="30" rx="15" fill="#cfdfeb"/>
<text x="1004" y="1338" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">PRACTICE EVALUATOR</text>
<text x="992" y="1380" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Assess reasoning on fresh cases</text>
<text x="992" y="1404" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Use the configured rubric; support revisions</text>
<text x="992" y="1427" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">and track independent concept evidence.</text>
