<path d="M1345 1439 V1467" fill="none" stroke="#587184" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="75" y="1475" width="760" height="134" rx="17" fill="#edf3ee" stroke="#587184" stroke-width="2"/>
<rect x="97" y="1487" width="186" height="30" rx="15" fill="#cfdfeb"/>
<text x="114" y="1508" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">SDL CONTROLLER</text>
<text x="102" y="1550" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Mark lesson complete</text>
<text x="102" y="1574" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Save the application response, feedback,</text>
<text x="102" y="1597" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">completion state, and code.</text>
<rect x="965" y="1475" width="760" height="134" rx="17" fill="#edf3ee" stroke="#587184" stroke-width="2"/>
<rect x="987" y="1487" width="241" height="30" rx="15" fill="#cfdfeb"/>
<text x="1004" y="1508" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#1b3348">REFLECTION + CHOICE</text>
<text x="992" y="1550" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" fill="#1b3348">Reflect, then choose what is next</text>
<text x="992" y="1574" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">Save the learner’s reflection; return to a</text>
<text x="992" y="1597" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#1b3348">study or practice choice. Pause is available.</text>
<rect x="75" y="1665" width="1650" height="160" rx="20" fill="#ffffff" stroke="#587184" stroke-width="2"/>
<text x="110" y="1705" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#1b3348">SHARED CONTROL RULES</text>
<text x="110" y="1742" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" fill="#1b3348">The published snapshot controls questions, answer keys, and rubrics.</text>
<text x="110" y="1780" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" fill="#1b3348">Each turn is saved atomically; repeated turn IDs return the saved result. Pause and resume preserve stage.</text>
