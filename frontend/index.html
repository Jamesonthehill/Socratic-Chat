<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My RAG Chatbot</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <section id="authScreen" class="auth-screen">
      <div class="auth-card">
        <p class="eyebrow">Personal RAG Workspace</p>
        <h1>Welcome back</h1>
        <p class="auth-copy">Sign in or create an account so your chats and uploaded files stay connected to you.</p>

        <div id="googleSignInWrap" class="google-signin-wrap">
          <div id="googleSignInButton"></div>
        </div>

        <div class="auth-divider"><span>or use email</span></div>

        <div class="auth-tabs" role="tablist" aria-label="Authentication">
          <button id="showLoginButton" class="auth-tab is-active" type="button">Login</button>
          <button id="showRegisterButton" class="auth-tab" type="button">Register</button>
        </div>

        <form id="loginForm" class="auth-form">
          <label>
            Email or username
            <input id="loginIdentifier" type="text" autocomplete="username" required />
          </label>
          <label>
            Password
            <input id="loginPassword" type="password" autocomplete="current-password" required />
          </label>
          <button type="submit">Login</button>
        </form>

        <form id="registerForm" class="auth-form is-hidden">
          <label>
            Username
            <input id="registerUsername" type="text" autocomplete="username" required minlength="2" />
          </label>
          <label>
            Email
            <div class="email-code-row">
              <input id="registerEmail" type="email" autocomplete="email" required />
              <button id="sendEmailCodeButton" class="secondary-auth-button" type="button">Send code</button>
            </div>
          </label>
          <label>
            Verification code
            <input id="registerVerificationCode" type="text" inputmode="numeric" autocomplete="one-time-code" required minlength="6" maxlength="6" placeholder="6-digit code" />
          </label>
          <label>
            Password
            <input id="registerPassword" type="password" autocomplete="new-password" required minlength="6" />
          </label>
          <button type="submit">Create account</button>
        </form>

        <div id="authStatus" class="auth-status"></div>
      </div>
    </section>

    <main id="appShell" class="app-shell is-hidden">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div>
            <p class="eyebrow">Personal RAG Workspace</p>
            <h1>My RAG Chatbot</h1>
          </div>
          <button id="logoutButton" class="icon-button" type="button" title="Log out" aria-label="Log out">↪</button>
        </div>
        <div id="userBadge" class="user-badge"></div>
        <div id="sessionWarning" class="session-warning" aria-live="assertive">
          <div class="session-warning-title">Session ending soon</div>
          <div id="sessionWarningText">Do you need more time?</div>
          <div class="session-warning-actions">
            <button id="extendSessionButton" class="session-extend-button" type="button">Keep me signed in</button>
            <button id="sessionLogoutButton" class="session-logout-button" type="button">Log out</button>
          </div>
        </div>

        <div class="sidebar-actions">
          <button id="newChatButton">New chat</button>
        </div>
        <input id="fileInput" class="file-input" type="file" accept=".txt,.md,.pdf" multiple />
        <div id="scanStatus" class="status"></div>

        <section class="thread-section">
          <h2>Chats</h2>
          <div id="threadList" class="thread-list"></div>
        </section>
      </aside>

      <section id="chatPanel" class="chat-panel">
        <div id="dropOverlay" class="drop-overlay">Drop documents to attach them to this chat</div>
        <aside id="chatFilePanel" class="chat-file-panel" aria-live="polite"></aside>
        <div id="messages" class="messages"></div>
        <form id="chatForm" class="composer">
          <div id="attachmentTray" class="attachment-tray"></div>
          <textarea id="messageInput" rows="2" placeholder="Ask your documents a question"></textarea>
          <button id="composerAttachButton" class="composer-attach-button" type="button" title="Attach documents" aria-label="Attach documents">+</button>
          <button id="sendButton" type="submit">Send</button>
        </form>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
