services:
  - type: web
    name: socratic-chat-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DEBUG_PIPELINE_LOGS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_BASE_URL
        value: https://api.openai.com/v1
      - key: RAG_MODEL
        value: gpt-4.1-mini
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_CLASSIFIER_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_ANSWER_EVALUATION_MODEL
        value: openai/gpt-oss-120b
      - key: CLASSIFIER_ENABLED
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: REQUIRE_GITHUB_ACCOUNT
        value: "true"
      - key: GITHUB_CALLBACK_URL
        value: https://socratic-chat-api.onrender.com/api/auth/github/callback
      - key: FRONTEND_URL
        value: https://jamesonthehill.com/Socratic-Chat/
      - key: AUTH_MODE
        value: school_github
      - key: ALLOWED_GITHUB_EMAIL_DOMAINS
        value: charlotte.edu
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: AUTH_SESSION_MINUTES
        value: "60"
      - key: ALLOW_PASSWORD_LOGIN
        value: "true"
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://jamesonthehill.github.io,https://jamesonthehill.com"
      - key: PLATFORM_DB_SCHEMA
        value: platform
      - key: SOCRATIC_DB_SCHEMA
        value: socratic_chat
      # Canvas LTI 1.3 course navigation. See README "Canvas LTI 1.3".
      - key: LTI_PUBLIC_BASE_URL
        value: https://socratic-chat-api.onrender.com
      - key: LTI_TOOL_PRIVATE_KEY_B64
        sync: false
      - key: LTI_TOOL_KEY_ID
        value: socratic-chat-lti-1
      - key: LTI_CANVAS_ISSUER
        value: https://canvas.instructure.com
      - key: LTI_PLATFORM_JWKS_URL
        value: https://sso.canvaslms.com/api/lti/security/jwks
      - key: LTI_AUTHORIZATION_URL
        value: https://sso.canvaslms.com/api/lti/authorize_redirect
      - key: LTI_CLIENT_ID
        sync: false
      - key: LTI_DEPLOYMENT_ID
        sync: false
