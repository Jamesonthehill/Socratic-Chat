# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free Render compute only: no paid instances, disks, or database are provisioned.
services:
  - type: web
    name: cluball-platform
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && cd platform_frontend && npm ci && npm run build
    # Free services require public HTTPS; Render supplies each public hostname.
    startCommand: >-
      REFLECTIONS_URL="https://${REFLECTIONS_HOSTNAME}"
      SELF_DIRECTED_LEARNING_URL="https://${SDL_HOSTNAME}"
      python -m uvicorn platform_app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - fromGroup: cluball-shared
      - key: DATABASE_URL
        fromService:
          name: cluball-reflections
          type: web
          envVarKey: DATABASE_URL
      - key: GROQ_API_KEY
        fromService:
          name: cluball-reflections
          type: web
          envVarKey: GROQ_API_KEY
      - key: OPENAI_API_KEY
        fromService:
          name: cluball-reflections
          type: web
          envVarKey: OPENAI_API_KEY
      - key: PLATFORM_DB_SCHEMA
        value: platform
      - key: SOCRATIC_DB_SCHEMA
        value: socratic_chat
      - key: SHARED_RAG_DB_SCHEMA
        value: shared_rag
      - key: PIPELINE_TRACE_FILE
        value: /tmp/cluball/pipeline-traces.json
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: REFLECTIONS_HOSTNAME
        fromService:
          name: cluball-reflections
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: SDL_HOSTNAME
        fromService:
          name: cluball-sdl
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: LTI_CANVAS_ISSUER
        value: https://instructure.charlotte.edu
      - key: LTI11_CONSUMER_KEY
        sync: false
      - key: LTI11_SHARED_SECRET
        sync: false
      - key: LTI_CLIENT_ID
        sync: false
      - key: LTI_DEPLOYMENT_ID
        sync: false
      - key: LTI_PLATFORM_JWKS_URL
        value: https://sso.canvaslms.com/api/lti/security/jwks
      - key: LTI_PUBLIC_BASE_URL
        sync: false
      - key: LTI_TOOL_PRIVATE_KEY_B64
        sync: false
      - key: LTI_TOOL_KEY_ID
        value: cluball-lti-1
  # Separate process: both backends use the Python package name `app`.
  - type: web
    name: cluball-reflections
    runtime: python
    plan: free
    buildCommand: pip install -r reflections-app/backend/requirements.txt
    startCommand: cd reflections-app/backend && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - fromGroup: cluball-shared
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PLATFORM_DB_SCHEMA
        value: platform
      - key: REFLECTIONS_DB_SCHEMA
        value: reflections_app
      - key: HF_HOME
        value: /tmp/huggingface

  - type: web
    name: cluball-sdl
    runtime: docker
    plan: free
    dockerfilePath: ./adaptive-learning-app/backend/Dockerfile
    dockerContext: ./adaptive-learning-app/backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: cluball-shared
      - key: DATABASE_URL
        fromService:
          name: cluball-reflections
          type: web
          envVarKey: DATABASE_URL
      - key: GROQ_API_KEY
        fromService:
          name: cluball-reflections
          type: web
          envVarKey: GROQ_API_KEY
      - key: OPENAI_API_KEY
        fromService:
          name: cluball-reflections
          type: web
          envVarKey: OPENAI_API_KEY
      - key: PORT
        value: "8100"
      - key: PLATFORM_DB_SCHEMA
        value: platform
      - key: SELF_DIRECTED_LEARNING_DB_SCHEMA
        value: self_directed_learning
      - key: ADAPTIVE_PLATFORM_ONLY
        value: "true"
      - key: ADAPTIVE_ALLOW_DEMO_FALLBACK
        value: "false"
      - key: ADAPTIVE_DATA_DIR
        value: /tmp/sdl
      - key: HF_HOME
        value: /tmp/huggingface

# One database and service identity for all backends. Provider keys are entered
# during Blueprint creation; never place their actual values in this file.
envVarGroups:
  - name: cluball-shared
    envVars:
      - key: PLATFORM_SERVICE_TOKEN
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
