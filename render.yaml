services:
  - type: web
    name: socratic-chat-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: AUTH_MODE
        value: school_google
      - key: ALLOWED_GOOGLE_DOMAINS
        value: charlotte.edu
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: AUTH_SESSION_MINUTES
        value: "60"
      - key: CORS_ALLOWED_ORIGINS
        value: https://jamesonthehill.github.io
